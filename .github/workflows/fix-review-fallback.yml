name: Fix review fallback

on:
  push:
    paths:
      - '.github/workflows/fix-review-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unseen-word fallback from Review
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = "function next(){let p;if(mode==='review'){p=due();if(!p.length){$('note').textContent='Nothing due in '+N[lang]+' yet — showing a new word.';p=unseen()}}else{let d=due();p=d.length&&Math.random()<.34?d:unseen()}if(!p.length)p=W[lang];cur=pick(p);S.seen[k(cur)]=1;rev=card(cur).n>0&&Math.random()<.28;render();save()}"
          new = "function emptyReview(){cur=null;rev=false;$('answer').classList.remove('show');$('rating').classList.remove('show');$('reveal').hidden=true;$('eyebrow').textContent='Review · '+N[lang];$('word').textContent='Nothing to review yet';$('pron').textContent='Rate some '+N[lang]+' words first. They will return here when due.';$('prompt').hidden=true;$('def').textContent='';$('trans').textContent='';$('example').textContent='';$('note').textContent='Your review queue is empty.'}function next(){let p;if(mode==='review'){p=due();if(!p.length){emptyReview();save();return}}else{let d=due();p=d.length&&Math.random()<.34?d:unseen()}if(!p.length)p=W[lang];cur=pick(p);S.seen[k(cur)]=1;rev=card(cur).n>0&&Math.random()<.28;render();save()}"

          if old not in text:
              raise SystemExit('Expected review fallback was not found; refusing to alter index.html')

          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix empty review queue"
          git push
