name: Fix history mobile

on:
  push:
    paths:
      - '.github/workflows/fix-history-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make History visible on mobile
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = "$('historyBtn').onclick=()=>{$('panel').classList.toggle('show');hist()}"
          new = "$('historyBtn').onclick=()=>{const p=$('panel'),opening=!p.classList.contains('show');p.classList.toggle('show');$('historyBtn').classList.toggle('active',opening);hist();if(opening)setTimeout(()=>p.scrollIntoView({behavior:'smooth',block:'start'}),30)}"

          if old not in text:
              raise SystemExit('Expected History handler not found; refusing to alter index.html')

          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make History visible on mobile"
          git push
