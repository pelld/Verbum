<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1e8"><title>Verbum</title><style>:root{--bg:#f4f1e8;--paper:#fffdf8;--ink:#20201d;--muted:#77736a;--line:#ddd7ca;--accent:#293d55;--good:#35633d;--warn:#8a5a1f;--bad:#873b35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(720px,calc(100% - 24px));margin:auto;padding:18px 0 42px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}h1,.word{font-family:Georgia,serif}h1{margin:0;font-size:2rem}.tag{color:var(--muted);font-size:.85rem;margin-top:3px}.stats{display:flex;gap:7px}.stat{border:1px solid var(--line);border-radius:11px;padding:6px 9px;text-align:center;min-width:52px}.stat b{display:block}.stat small{color:var(--muted);font-size:.62rem;text-transform:uppercase}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:9px}.tab{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:9px 13px}.tab.active{background:var(--ink);color:white;border-color:var(--ink)}.sub .tab{font-size:.8rem;padding:7px 11px}.card{background:var(--paper);border:1px solid var(--line);border-radius:23px;min-height:440px;padding:34px 24px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:0 15px 45px #2a261e12}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:.68rem;color:var(--muted);margin-bottom:18px}.word{font-size:clamp(2.6rem,11vw,4.8rem);line-height:1;margin:0}.pron{color:var(--muted);margin-top:10px;min-height:22px}.prompt{font:1.45rem/1.4 Georgia,serif;max-width:530px;margin:25px auto 0}.reveal{align-self:center;margin-top:30px;border:0;border-radius:13px;background:var(--accent);color:white;padding:13px 20px;font-weight:650}.answer{display:none;margin-top:25px}.answer.show{display:block}.def{font-size:1.15rem;line-height:1.55;max-width:560px;margin:auto}.translation{color:var(--muted);margin:10px auto}.example{border-top:1px solid var(--line);padding-top:16px;margin:17px auto 0;max-width:560px;color:#555149;font-style:italic;line-height:1.5}.rating{display:none;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:22px}.rating.show{display:grid}.rate{border:1px solid var(--line);background:transparent;border-radius:13px;padding:12px 4px;font-weight:600}.rate[data-g="0"]{color:var(--bad)}.rate[data-g="1"]{color:var(--warn)}.rate[data-g="2"]{color:var(--good)}.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;padding:9px 2px}.linkbtn{border:0;background:none;color:inherit}.panel{display:none;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:4px}.panel.show{display:block}.hist{display:grid;gap:7px}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.85rem}.pill{border:1px solid var(--line);border-radius:999px;padding:2px 6px}@media(max-width:500px){.tag{display:none}.wrap{width:calc(100% - 18px);padding-top:12px}.card{min-height:455px;padding:28px 17px}.rate{font-size:.8rem}}</style></head><body><main class="wrap"><header><div><h1>Verbum</h1><div class="tag">A word remembered is a word acquired.</div></div><div class="stats"><div class="stat"><b id="known">0</b><small>known</small></div><div class="stat"><b id="due">0</b><small>due</small></div></div></header><nav class="tabs"><button class="tab lang active" data-l="en">English</button><button class="tab lang" data-l="fr">Français</button><button class="tab lang" data-l="es">Español</button><button class="tab" id="historyBtn">History</button></nav><nav class="tabs sub"><button class="tab mode active" data-m="new">New words</button><button class="tab mode" data-m="review">Review English</button></nav><section class="card"><div class="eyebrow" id="eyebrow"></div><h2 class="word" id="word"></h2><div class="pron" id="pron"></div><p class="prompt" id="prompt" hidden></p><button class="reveal" id="reveal">Reveal definition</button><div class="answer" id="answer"><p class="def" id="def"></p><p class="translation" id="trans"></p><p class="example" id="example"></p></div><div class="rating" id="rating"><button class="rate" data-g="0">Didn't know</button><button class="rate" data-g="1">Nearly</button><button class="rate" data-g="2">Knew it</button></div></section><div class="foot"><span id="note">Think first. Then reveal.</span><button class="linkbtn" id="reset">Reset progress</button></div><section class="panel" id="panel"><strong>Recent words</strong><div class="hist" id="hist"></div></section></main><script>const W={en:[['inchoate','in-KOH-it','Only partly formed or developed; not yet clear or organised.','','The proposal remained inchoate, more instinct than plan.'],['trenchant','TREN-chənt','Expressed forcefully, clearly and effectively, often in criticism.','','Her trenchant analysis exposed the weakness in the argument.'],['equivocal','ih-KWIV-ə-kəl','Open to more than one interpretation; deliberately unclear or uncertain.','','His equivocal answer left everyone unsure where he stood.'],['perfunctory','pər-FUNK-tə-ree','Done with minimal effort or interest, merely as a routine duty.','','The apology felt perfunctory rather than sincere.'],['recondite','REK-ən-dyte','Little known and difficult to understand; abstruse.','','The discussion drifted into recondite questions of legal history.'],['pellucid','pə-LOO-sid','Very clear in meaning or style; lucid.','','She gave a pellucid explanation of a difficult idea.'],['obdurate','OB-dyə-rət','Stubbornly refusing to change an opinion or course of action.','','The committee remained obdurate despite the new evidence.'],['laconic','lə-KON-ik','Using very few words; brief to the point of seeming abrupt.','','His laconic reply consisted of a single word.'],['liminal','LIM-in-əl','Relating to a threshold or transitional state between two conditions.','','Airports can feel like liminal spaces between ordinary routines.'],['inimical','ih-NIM-i-kəl','Tending to obstruct, harm or oppose; adverse.','','A culture of blame is inimical to honest learning.'],['sanguine','SANG-gwin','Optimistic or confident, especially in a difficult situation.','','She remained sanguine about the project despite the delay.'],['specious','SPEE-shəs','Seeming plausible at first, but actually incorrect or misleading.','','The neat conclusion rested on a specious assumption.'],['assiduous','ə-SID-yoo-əs','Showing great care, persistence and attention to a task.','','Assiduous practice gradually made the difficult passage effortless.'],['capricious','kə-PRISH-əs','Changing suddenly and unpredictably.','','The capricious weather made planning difficult.'],['diffident','DIF-i-dənt','Modest or shy because of a lack of self-confidence.','','He was surprisingly diffident when asked to defend his own work.']],fr:[['enjeu','ahn-ZHU','Ce que l’on risque de gagner ou de perdre dans une situation.','stake; issue','L’accès aux soins est un enjeu majeur.'],['pourtant','poor-TAHN','Introduit une opposition entre deux faits; malgré cela.','yet; however','Il était fatigué, pourtant il a continué.'],['parvenir','par-vuh-NEER','Réussir à atteindre un but ou à faire quelque chose.','to manage; succeed','Elle est parvenue à résoudre le problème.'],['bouleverser','boo-luh-vair-SAY','Changer profondément une situation ou provoquer une forte émotion.','to disrupt; deeply affect','Cette découverte a bouleversé notre compréhension du sujet.'],['démarche','day-MARSH','Manière d’agir pour atteindre un objectif; ensemble d’étapes entreprises.','approach; process','La démarche repose sur plusieurs étapes.'],['davantage','da-vahn-TAHZH','En plus grande quantité ou à un degré supérieur.','more; further','Il faudrait investir davantage dans la prévention.'],['voire','VWAHR','Et même; sert à ajouter une possibilité plus forte.','even; indeed','Le délai peut durer plusieurs semaines, voire plusieurs mois.'],['néanmoins','nay-ahn-MWAN','Malgré ce qui vient d’être dit; toutefois.','nevertheless','Les résultats sont encourageants; néanmoins, il faut rester prudent.'],['s’avérer','sa-vay-RAY','Se révéler être d’une certaine façon après vérification ou expérience.','to prove; turn out','La solution s’est avérée plus coûteuse que prévu.'],['à l’égard de','a lay-GAHR duh','Envers; en ce qui concerne une personne, un groupe ou une chose.','towards; with regard to','Son attitude à l’égard du changement a évolué.'],['aboutir','a-boo-TEER','Arriver à un résultat, généralement après un processus ou un effort.','to result in; succeed','Les négociations ont finalement abouti à un accord.'],['susciter','soo-see-TAY','Faire naître une réaction, un sentiment, une question ou un intérêt.','to arouse; prompt','La décision a suscité de nombreuses réactions.'],['évoquer','ay-vo-KAY','Mentionner un sujet ou faire penser à quelque chose.','to mention; evoke','Le rapport évoque plusieurs causes possibles.'],['d’autant plus','do-tahn PLOO','Indique qu’une chose est encore plus vraie en raison d’un élément supplémentaire.','all the more','C’est d’autant plus important que le délai est court.'],['faute de','FOHT duh','En raison de l’absence ou du manque de quelque chose.','for lack of','Faute de temps, nous avons reporté la visite.']],es:[['plantear','plan-teh-AR','Proponer, exponer o considerar un problema, una pregunta o una posibilidad.','to raise; propose; frame','El informe plantea varias preguntas importantes.'],['lograr','loh-GRAR','Conseguir o alcanzar algo después de un esfuerzo.','to achieve; manage to','El equipo logró reducir el tiempo de espera.'],['sin embargo','seen em-BAR-goh','Expresión que introduce una idea contraria o una limitación respecto a lo anterior.','however; nevertheless','Los resultados mejoraron; sin embargo, persisten problemas.'],['ámbito','AM-bee-toh','Espacio, campo o área en la que se desarrolla una actividad.','field; sphere; area','Trabaja en el ámbito de la salud pública.'],['llevar a cabo','yeh-VAR a KAH-boh','Realizar o ejecutar una acción, un plan o un proyecto.','to carry out','Se llevó a cabo un estudio en varias ciudades.'],['hallazgo','ah-YAS-goh','Resultado o descubrimiento obtenido mediante investigación u observación.','finding; discovery','El principal hallazgo del estudio fue inesperado.'],['abordar','a-bor-DAR','Tratar un asunto o problema con intención de resolverlo o entenderlo.','to address; tackle','Necesitamos abordar las causas del problema.'],['fomentar','fo-men-TAR','Promover o impulsar una actividad, una actitud o un desarrollo.','to encourage; foster','La política pretende fomentar hábitos saludables.'],['sesgo','SES-goh','Tendencia o desviación sistemática que puede afectar un juicio o resultado.','bias','La selección de participantes puede introducir un sesgo.'],['desempeñar','de-sem-peh-NYAR','Ejercer una función, cargo o papel; realizar una tarea.','to perform; play a role','La atención primaria desempeña un papel fundamental.'],['respaldar','res-pal-DAR','Dar apoyo o fundamento a una persona, decisión o afirmación.','to support; back up','Los resultados respaldan la hipótesis inicial.'],['carecer de','ka-reh-SER deh','No tener algo que se considera necesario o útil.','to lack','El estudio carece de información sobre la edad.'],['conllevar','kon-yeh-VAR','Implicar o traer como consecuencia algo, especialmente una dificultad.','to entail; involve','El cambio puede conllevar costes adicionales.'],['matizar','ma-tee-SAR','Introducir precisiones para evitar una afirmación demasiado absoluta.','to qualify; nuance','Conviene matizar la conclusión antes de generalizarla.'],['poner de manifiesto','po-NER deh ma-nee-FYES-toh','Hacer evidente o mostrar claramente algo que antes no lo era.','to reveal; highlight','Los datos ponen de manifiesto una diferencia importante.']]};const N={en:'English',fr:'Français',es:'Español'},KEY='verbum.v1';let S=load(),lang=S.lang||'en',mode='new',cur,rev=false;const $=x=>document.getElementById(x);function fresh(){return{lang:'en',cards:{},seen:{},history:[]}}function load(){try{return{...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return fresh()}}function save(){S.lang=lang;localStorage.setItem(KEY,JSON.stringify(S));stats()}function k(w){return lang+'::'+w[0]}function card(w){return S.cards[k(w)]||{stage:0,due:0,n:0}}function due(){return W[lang].filter(w=>card(w).n&&card(w).due<=Date.now())}function unseen(){return W[lang].filter(w=>!S.seen[k(w)])}function pick(a){return a[Math.floor(Math.random()*a.length)]}function next(){let p;if(mode==='review'){p=due();if(!p.length){$('note').textContent='Nothing due in '+N[lang]+' yet — showing a new word.';p=unseen()}}else{let d=due();p=d.length&&Math.random()<.34?d:unseen()}if(!p.length)p=W[lang];cur=pick(p);S.seen[k(cur)]=1;rev=card(cur).n>0&&Math.random()<.28;render();save()}function render(){$('answer').classList.remove('show');$('rating').classList.remove('show');$('reveal').hidden=false;$('eyebrow').textContent=(card(cur).n?'Review':'New word')+' · '+N[lang];$('def').textContent=cur[2];$('trans').textContent=cur[3]?'English: '+cur[3]:'';$('example').textContent=cur[4]?'“'+cur[4]+'”':'';if(rev){$('word').textContent='?';$('pron').textContent='Recall the word';$('prompt').hidden=false;$('prompt').textContent=cur[2];$('reveal').textContent='Reveal word'}else{$('word').textContent=cur[0];$('pron').textContent=cur[1];$('prompt').hidden=true;$('reveal').textContent='Reveal definition'}$('note').textContent=card(cur).n?'This word has come back for review.':'Think first. Then reveal.'}function reveal(){if(rev){$('word').textContent=cur[0];$('pron').textContent=cur[1]}$('answer').classList.add('show');$('rating').classList.add('show');$('reveal').hidden=true}function rate(g){let c=card(cur);c.n++;c.stage=g===2?Math.min(c.stage+1,6):g===1?Math.max(1,c.stage):0;let ints=g===0?[.003]:g===1?[.02,1,2,4]:[1,3,7,14,30,60,120];c.due=Date.now()+ints[Math.min(c.stage,ints.length-1)]*864e5;S.cards[k(cur)]=c;S.history.unshift({l:lang,w:cur[0],g});S.history=S.history.slice(0,50);save();hist();next()}function stats(){let a=Object.values(S.cards);$('known').textContent=a.filter(c=>c.stage>=3).length;$('due').textContent=['en','fr','es'].reduce((n,l)=>n+W[l].filter(w=>{let c=S.cards[l+'::'+w[0]];return c&&c.n&&c.due<=Date.now()}).length,0)}function syncNav(){document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.m===mode));document.querySelector('.mode[data-m="review"]').textContent='Review '+N[lang]}function setLang(l){lang=l;mode='new';syncNav();next()}function hist(){$('hist').innerHTML=S.history.length?S.history.slice(0,20).map(r=>`<div class="row"><b>${r.w}</b><span>${N[r.l]}</span><span class="pill">${['Again','Nearly','Knew'][r.g]}</span></div>`).join(''):'<p>No reviewed words yet.</p>'}document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLang(b.dataset.l));document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.m;syncNav();next()});$('reveal').onclick=reveal;$('rating').onclick=e=>{let b=e.target.closest('[data-g]');if(b)rate(+b.dataset.g)};$('historyBtn').onclick=()=>{$('panel').classList.toggle('show');hist()};$('reset').onclick=()=>{if(confirm('Erase all saved Verbum progress on this device?')){localStorage.removeItem(KEY);S=fresh();setLang('en');hist()}};document.onkeydown=e=>{if(e.code==='Space'&&!$('answer').classList.contains('show')){e.preventDefault();reveal()}else if($('answer').classList.contains('show')&&['1','2','3'].includes(e.key))rate(+e.key-1)};stats();hist();setLang(lang);</script></body></html>
